services:
  mongo:
    image: mongo:7
    ports:
      - 27017:27017
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "localhost:27017/test",
          "--quiet",
          "--eval",
          "db.runCommand('ping').ok",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      [
        "mongosh",
        "--host",
        "mongo:27017",
        "--eval",
        "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})",
      ]

  # mongo-express:
  #   image: mongo-express
  #   ports:
  #     - 8081:8081
  #   environment:
  #     ME_CONFIG_MONGODB_SERVER: mongo
  #   depends_on:
  #     mongo:
  #       condition: service_healthy
  #     mongo-init:
  #       condition: service_completed_successfully
  #   restart: unless-stopped

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - 5432:5432

  adminer:
    image: adminer:6.3.0
    ports:
      - 8081:8080
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Generate prisma types
        run: npx prisma generate
      - name: Build app
        run: npm run build
        env:
          DATABASE_URL: postgresql://admin:password@localhost:5432/db?schema=public # Only required for build, not used at runtime
      - name: Test
        run: npm test

name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Generate prisma types
        run: npx prisma generate
      - name: Build app
        run: npm run build
        env:
          DATABASE_URL: postgresql://admin:password@localhost:5432/db?schema=public # Only required for build, not used at runtime
      - name: Test
        run: npm test
      - name: Containerize
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/containerize
        with:
          actor: ${{ github.actor }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dhi_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dhi_token: ${{ secrets.DOCKERHUB_TOKEN }}
